# Site settings
title: JP Chavat
description: "An open notebook of papers, charts and ideas that caught my interest, sometimes with a thought of my own. JP Chavat, Agentic Engineer, MSc in Computer Science."
author: JP Chavat
lang: en

# URLs
email: hey@jpchavat.com
baseurl: ""
url: "https://jpchavat.com"

# Social
twitter_username: jpchavat
github_username: jpchavat
linkedin_username: jpchavat

# SEO / Open Graph
logo: /assets/avatar.jpg
twitter:
  username: jpchavat
  card: summary_large_image
social:
  name: JP Chavat
  links:
    - https://www.linkedin.com/in/jpchavat
    - https://github.com/jpchavat

# Build
markdown: kramdown
permalink: /:year/:month/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "en"
      image:
        path: /assets/og-image.jpg
        width: 1200
        height: 630
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      lang: "en"
      image:
        path: /assets/og-image.jpg
        width: 1200
        height: 630
